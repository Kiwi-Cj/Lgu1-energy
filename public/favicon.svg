<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Energy Lightning Bolt Icon -->
  <path d="M68 18 L34 70 L62 70 L52 110 L94 56 L68 56 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" 
        stroke="#ca8a04" 
        stroke-width="1.5" 
        stroke-linejoin="round" />
</svg>
